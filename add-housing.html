<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة سكن - سكني</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">
                <i class="fas fa-home"></i>
                <span>سكني</span>
            </a>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="dashboard.html"><i class="fas fa-building"></i> السكن</a></li>
                <li><a href="my-bookings.html"><i class="fas fa-calendar-check"></i> حجوزاتي</a></li>
                <li><a href="roommate-finder.html"><i class="fas fa-users"></i> زميلات</a></li>
                <li><a href="add-housing.html" class="active"><i class="fas fa-plus"></i> إضافة سكن</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-title">
                <h1><i class="fas fa-plus-circle"></i> إضافة سكن جديد</h1>
            </div>

            <div class="form-card">
                <form id="addHousingForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>عنوان الإعلان *</label>
                            <input type="text" id="housingTitle" required placeholder="مثال: غرفة مفردة قرب الجامعة">
                        </div>
                        <div class="form-group">
                            <label>المدينة *</label>
                            <select id="housingCity" required>
                                <option value="">اختاري</option>
                                <option value="مكة المكرمة">مكة المكرمة</option>
                                <option value="جدة">جدة</option>
                                <option value="الرياض">الرياض</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>العنوان التفصيلي *</label>
                        <input type="text" id="housingAddress" required placeholder="الحي، الشارع">
                    </div>
                    
                    <div class="form-group">
                        <label>الوصف</label>
                        <textarea id="housingDescription" rows="3" placeholder="وصف مختصر للسكن..."></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>السعر الشهري (ريال) *</label>
                            <input type="number" id="housingPrice" required placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>المساحة (م²)</label>
                            <input type="number" id="housingArea" placeholder="0">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>نوع الغرفة</label>
                            <select id="housingRoomType">
                                <option value="single">مفردة</option>
                                <option value="shared">مشتركة</option>
                                <option value="apartment">شقة</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>عدد الأسرة</label>
                            <input type="number" id="housingBeds" value="1" min="1">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>قرب الجامعة</label>
                        <input type="text" id="housingUniversity" placeholder="اسم الجامعة">
                    </div>
                    
                    <div class="form-group">
                        <label>المميزات</label>
                        <div class="features-grid">
                            <label><input type="checkbox" id="hasWifi"> واي فاي</label>
                            <label><input type="checkbox" id="hasAc"> تكييف</label>
                            <label><input type="checkbox" id="hasKitchen"> مطبخ</label>
                            <label><input type="checkbox" id="hasLaundry"> غسالة</label>
                            <label><input type="checkbox" id="hasSecurity"> أمن</label>
                            <label><input type="checkbox" id="hasParking"> موقف</label>
                            <label><input type="checkbox" id="hasFurniture"> مفروش</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-plus"></i>
                        إضافة السكن
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
