<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سكني - منصة سكن الطالبات</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .welcome-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            padding: 20px;
        }
        .welcome-card {
            background: white;
            border-radius: 24px;
            padding: 60px 50px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .welcome-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }
        .welcome-logo i {
            font-size: 2.5rem;
            color: white;
        }
        .welcome-card h1 {
            font-size: 2.2rem;
            color: #1f2937;
            margin-bottom: 15px;
        }
        .welcome-card p {
            color: #6b7280;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .welcome-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-welcome {
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-welcome.primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
        }
        .btn-welcome.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        .btn-welcome.secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-welcome.secondary:hover {
            background: #e5e7eb;
        }
        @media (max-width: 480px) {
            .welcome-card {
                padding: 40px 30px;
            }
            .welcome-card h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-page">
        <div class="welcome-card">
            <div class="welcome-logo">
                <i class="fas fa-home"></i>
            </div>
            <h1>مرحباً بكِ في سكني</h1>
            <p>منصتك لإيجاد السكن المثالي بسهولة وأمان</p>
            <div class="welcome-buttons">
                <a href="login.html" class="btn-welcome primary">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </a>
                <a href="register.html" class="btn-welcome secondary">
                    <i class="fas fa-user-plus"></i>
                    إنشاء حساب جديد
                </a>
            </div>
        </div>
    </div>
</body>
</html>
