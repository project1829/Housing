<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل السكن - سكني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fafbfc; font-family: 'Tajawal', Arial, sans-serif; min-height: 100vh; }
        .navbar { background: #384AA6; padding: 0.5rem 0; box-shadow: 0 2px 6px #ececec; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .back-btn { color: #fff; text-decoration: none; font-size: 1.1rem; padding: 0.5rem 1rem; border-radius: 8px; transition: background 0.2s; }
        .back-btn:hover { background: #212E6B; }
        .details-page { padding: 2rem 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
        .details-content { background: #fff; border-radius: 18px; padding: 2rem; box-shadow: 0 2px 10px #ececec; }
        .housing-images { margin-bottom: 2rem; }
        .main-image { width: 100%; height: 400px; object-fit: cover; border-radius: 16px; margin-bottom: 1rem; }
        .thumbnail-images { display: flex; gap: 0.8rem; overflow-x: auto; }
        .thumbnail-images img { width: 120px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
        .thumbnail-images img:hover { border-color: #384AA6; }
        .housing-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .housing-title h1 { font-size: 1.8rem; color: #333; margin-bottom: 0.5rem; }
        .housing-location { color: #666; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .housing-price { color: #384AA6; font-size: 1.5rem; font-weight: bold; }
        .housing-actions { display: flex; gap: 0.8rem; }
        .btn { padding: 0.6rem 1.3rem; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
        .btn-primary { background: #384AA6; color: #fff; }
        .btn-primary:hover { background: #212E6B; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .housing-info { margin-bottom: 2rem; }
        .info-section { margin-bottom: 2rem; }
        .info-section h2 { font-size: 1.3rem; color: #384AA6; margin-bottom: 1rem; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .info-item { display: flex; align-items: center; gap: 0.6rem; color: #666; font-size: 1rem; }
        .info-item i { color: #384AA6; width: 20px; }
        .features-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.8rem; }
        .feature-item { background: #f8f9fa; padding: 0.7rem; border-radius: 8px; display: flex; align-items: center; gap: 0.6rem; }
        .feature-item i { color: #384AA6; }
        .description { line-height: 1.8; color: #555; font-size: 1.05rem; }
        .owner-info { background: #f8f9fa; padding: 1.5rem; border-radius: 12px; margin-top: 2rem; }
        .owner-info h3 { color: #384AA6; margin-bottom: 1rem; }
        .loading { text-align: center; padding: 3rem; color: #666; font-size: 1.5rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(44, 58, 95, 0.18); z-index: 1200; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; min-width: 400px; max-width: 500px; border-radius: 18px; padding: 1.5rem; box-shadow: 0 4px 16px #bbb7; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .modal-header h3 { margin: 0; color: #384AA6; font-size: 1.3rem; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: #384AA6; cursor: pointer; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #384AA6; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit; }
        .btn-submit { width: 100%; background: #384AA6; color: #fff; padding: 0.8rem; border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer; }
        .btn-submit:hover { background: #212E6B; }
        .share-link { display: flex; gap: 0.7rem; margin-bottom: 1rem; }
        .share-link input { flex: 1; border: 1px solid #ececec; border-radius: 7px; padding: 0.6rem; font-size: 1rem; }
        .share-link button { background: #384AA6; color: #fff; border: none; border-radius: 7px; padding: 0.6rem 1rem; cursor: pointer; }
        .share-options { display: flex; gap: 1rem; justify-content: center; }
        .share-btn { font-size: 1.4rem; border: none; border-radius: 50%; padding: 0.6rem 0.8rem; color: #fff; text-decoration: none; }
        .whatsapp { background: #25d366; }
        .telegram { background: #0088cc; }
        .email { background: #efc334; color: #444; }
        @media (max-width: 768px) {
            .main-image { height: 250px; }
            .housing-header { flex-direction: column; }
            .modal-content { min-width: 90%; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">
                <i class="fas fa-home"></i>
                <span>سكني</span>
            </a>
            <a href="dashboard.html" class="back-btn">
                <i class="fas fa-arrow-right"></i>
                رجوع
            </a>
        </div>
    </nav>

    <main class="details-page">
        <div class="container">
            <div class="details-content" id="housingDetails"></div>
        </div>
    </main>

    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-calendar-plus"></i> حجز السكن</h3>
                <button class="modal-close" id="closeBookingModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="form-group">
                        <label>تاريخ البدء</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label>تاريخ الانتهاء (اختياري)</label>
                        <input type="date" id="endDate">
                    </div>
                    <div class="form-group">
                        <label>ملاحظات</label>
                        <textarea id="bookingNotes" rows="3" placeholder="أي ملاحظات إضافية..."></textarea>
                    </div>
                    <input type="hidden" id="bookingHousingId">
                    <button type="submit" class="btn-submit">تأكيد الحجز</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="contactModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-envelope"></i> تواصل مع المالك</h3>
                <button class="modal-close" id="closeContactModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="contactForm">
                    <div class="form-group">
                        <label>رسالتك</label>
                        <textarea id="contactMessage" rows="4" required placeholder="اكتبي رسالتك هنا..."></textarea>
                    </div>
                    <input type="hidden" id="contactOwnerId">
                    <input type="hidden" id="contactHousingId">
                    <button type="submit" class="btn-submit">إرسال الرسالة</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-share-alt"></i> مشاركة السكن</h3>
                <button class="modal-close" id="closeShareModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="share-link">
                    <input type="text" id="shareLink" readonly>
                    <button id="copyLink"><i class="fas fa-copy"></i></button>
                </div>
                <div class="share-options">
                    <a href="#" class="share-btn whatsapp" id="shareWhatsapp"><i class="fab fa-whatsapp"></i></a>
                    <a href="#" class="share-btn telegram" id="shareTelegram"><i class="fab fa-telegram"></i></a>
                    <a href="#" class="share-btn email" id="shareEmail"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const housingData = {
            id: 1,
            title: "شقة راقية في جدة",
            city: "جدة",
            district: "حي الروضة",
            price: 3200,
            roomType: "شقة",
            bedrooms: 2,
            bathrooms: 2,
            area: 120,
            floor: 3,
            wifi: true,
            ac: true,
            kitchen: true,
            security: true,
            parking: true,
            furnished: true,
            description: "شقة فاخرة ومجهزة بالكامل في موقع استراتيجي بحي الروضة في جدة. تتميز الشقة بإطلالة رائعة وتصميم عصري يوفر الراحة والخصوصية. قريبة من جميع الخدمات والمرافق الأساسية مثل المدارس والمراكز التجارية والمستشفيات. مناسبة للعائلات الصغيرة أو المهنيات.",
            owner: {
                name: "فاطمة أحمد",
                phone: "0501234567",
                email: "fatima@example.com"
            },
            images: [
                "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800&q=80",
                "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=400&q=80",
                "https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=400&q=80",
                "https://images.unsplash.com/photo-1540518614846-7eded433c457?auto=format&fit=crop&w=400&q=80"
            ]
        };

        function renderHousingDetails(housing) {
            const detailsContainer = document.getElementById('housingDetails');
            detailsContainer.innerHTML = `
                <div class="housing-images">
                    <img src="${housing.images[0]}" alt="${housing.title}" class="main-image" id="mainImage">
                    <div class="thumbnail-images">
                        ${housing.images.map((img, index) => `
                            <img src="${img}" alt="صورة ${index + 1}" onclick="changeMainImage('${img}')">
                        `).join('')}
                    </div>
                </div>

                <div class="housing-header">
                    <div class="housing-title">
                        <h1>${housing.title}</h1>
                        <div class="housing-location">
                            <i class="fas fa-map-marker-alt"></i> ${housing.city} - ${housing.district}
                        </div>
                        <div class="housing-price">
                            <i class="fas fa-money-bill-wave"></i> ${housing.price} ريال/شهر
                        </div>
                    </div>
                    <div class="housing-actions">
                        <button class="btn btn-primary" onclick="openBookingModal(${housing.id})">
                            <i class="fas fa-calendar-check"></i> احجزي الآن
                        </button>
                        <button class="btn btn-secondary" onclick="openContactModal(${housing.id})">
                            <i class="fas fa-envelope"></i> تواصل
                        </button>
                        <button class="btn btn-secondary" onclick="openShareModal()">
                            <i class="fas fa-share-alt"></i> مشاركة
                        </button>
                    </div>
                </div>

                <div class="housing-info">
                    <div class="info-section">
                        <h2><i class="fas fa-info-circle"></i> معلومات أساسية</h2>
                        <div class="info-grid">
                            <div class="info-item">
                                <i class="fas fa-bed"></i>
                                <span>${housing.bedrooms} غرف نوم</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-bath"></i>
                                <span>${housing.bathrooms} حمام</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-ruler-combined"></i>
                                <span>${housing.area} متر مربع</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-building"></i>
                                <span>الطابق ${housing.floor}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-door-closed"></i>
                                <span>${housing.roomType}</span>
                            </div>
                            <div class="info-item">
                                <i class="fas fa-couch"></i>
                                <span>${housing.furnished ? 'مفروشة' : 'غير مفروشة'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <h2><i class="fas fa-star"></i> المميزات</h2>
                        <div class="features-list">
                            ${housing.wifi ? '<div class="feature-item"><i class="fas fa-wifi"></i> واي فاي</div>' : ''}
                            ${housing.ac ? '<div class="feature-item"><i class="fas fa-snowflake"></i> تكييف</div>' : ''}
                            ${housing.kitchen ? '<div class="feature-item"><i class="fas fa-utensils"></i> مطبخ مجهز</div>' : ''}
                            ${housing.security ? '<div class="feature-item"><i class="fas fa-shield-alt"></i> حراسة أمنية</div>' : ''}
                            ${housing.parking ? '<div class="feature-item"><i class="fas fa-car"></i> موقف سيارة</div>' : ''}
                        </div>
                    </div>

                    <div class="info-section">
                        <h2><i class="fas fa-file-alt"></i> الوصف</h2>
                        <p class="description">${housing.description}</p>
                    </div>

                    <div class="owner-info">
                        <h3><i class="fas fa-user"></i> معلومات المالك</h3>
                        <div class="info-item">
                            <i class="fas fa-user-circle"></i>
                            <span>${housing.owner.name}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-phone"></i>
                            <span>${housing.owner.phone}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-envelope"></i>
                            <span>${housing.owner.email}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeMainImage(src) {
            document.getElementById('mainImage').src = src;
        }

        function openBookingModal(id) {
            document.getElementById('bookingHousingId').value = id;
            document.getElementById('bookingModal').classList.add('active');
        }

        function openContactModal(id) {
            document.getElementById('contactHousingId').value = id;
            document.getElementById('contactModal').classList.add('active');
        }

        function openShareModal() {
            document.getElementById('shareLink').value = window.location.href;
            document.getElementById('shareModal').classList.add('active');
        }

        document.getElementById('closeBookingModal').addEventListener('click', function() {
            document.getElementById('bookingModal').classList.remove('active');
        });

        document.getElementById('closeContactModal').addEventListener('click', function() {
            document.getElementById('contactModal').classList.remove('active');
        });

        document.getElementById('closeShareModal').addEventListener('click', function() {
            document.getElementById('shareModal').classList.remove('active');
        });

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إرسال طلب الحجز بنجاح! سيتم التواصل معك قريباً.');
            document.getElementById('bookingModal').classList.remove('active');
        });

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إرسال رسالتك بنجاح!');
            document.getElementById('contactModal').classList.remove('active');
        });

        document.getElementById('copyLink').addEventListener('click', function() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
            alert('تم نسخ الرابط!');
        });

        renderHousingDetails(housingData);
    </script>
</body>
</html>
