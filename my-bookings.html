<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزاتي - سكني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fafbfc; font-family: 'Tajawal', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: #384AA6; padding: 0.5rem 0; box-shadow: 0 2px 6px #ececec; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0; }
        .nav-menu li a { color: #fff; font-size: 1.09rem; text-decoration: none; padding: 0.5rem 1rem; border-radius: 24px; transition: background 0.2s; }
        .nav-menu li a.active, .nav-menu li a:hover { background: #212E6B; }
        .nav-toggle { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .main-content { flex: 1; padding: 2rem 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
        .page-title { margin-bottom: 2rem; }
        .page-title h1 { color: #384AA6; font-size: 1.8rem; display: flex; align-items: center; gap: 0.7rem; }
        .bookings-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; background: #fff; padding: 1rem; border-radius: 16px; box-shadow: 0 2px 8px #ececec; flex-wrap: wrap; }
        .tab-btn { background: #f5f5f5; color: #666; border: none; padding: 0.6rem 1.5rem; border-radius: 12px; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { background: #e0e0e0; }
        .tab-btn.active { background: #384AA6; color: #fff; }
        .bookings-list { display: flex; flex-direction: column; gap: 1.2rem; }
        .booking-card { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 10px #ececec; display: flex; gap: 1.5rem; transition: transform 0.2s; }
        .booking-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px #ddd; }
        .booking-image { width: 150px; height: 120px; border-radius: 12px; object-fit: cover; }
        .booking-info { flex: 1; }
        .booking-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .booking-title { font-size: 1.3rem; font-weight: bold; color: #333; }
        .booking-status { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.9rem; font-weight: 500; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .booking-details { display: flex; flex-direction: column; gap: 0.6rem; color: #666; margin-bottom: 1rem; }
        .booking-detail { display: flex; align-items: center; gap: 0.5rem; }
        .booking-detail i { color: #384AA6; width: 20px; }
        .booking-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .btn { padding: 0.5rem 1.2rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: all 0.2s; }
        .btn-primary { background: #384AA6; color: #fff; }
        .btn-primary:hover { background: #212E6B; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #5a6268; }
        .loading { text-align: center; padding: 3rem; color: #666; font-size: 1.5rem; }
        .no-results { text-align: center; padding: 3rem; color: #999; }
        .no-results i { font-size: 4rem; margin-bottom: 1rem; }
        .no-results p { font-size: 1.3rem; margin-bottom: 1.5rem; }
        .footer { background: #212E6B; color: #fff; text-align: center; padding: 0.9rem 0 1.2rem 0; font-size: 1rem; letter-spacing: 1px; margin-top: 2rem; }
        .footer i { color: #ea5073; position: relative; top: 1.5px; }
        @media (max-width: 768px) {
            .nav-menu { flex-direction: column; position: absolute; top: 58px; right: 0; background: #384AA6; width: 190px; z-index: 100; display: none; }
            .nav-menu.active { display: flex; }
            .nav-toggle { display: block; }
            .booking-card { flex-direction: column; }
            .booking-image { width: 100%; height: 180px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">
                <i class="fas fa-home"></i>
                <span>سكني</span>
            </a>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="dashboard.html"><i class="fas fa-building"></i> السكن</a></li>
                <li><a href="my-bookings.html" class="active"><i class="fas fa-calendar-check"></i> حجوزاتي</a></li>
                <li><a href="roommate-finder.html"><i class="fas fa-users"></i> زميلات</a></li>
                <li><a href="add-housing.html"><i class="fas fa-plus"></i> إضافة سكن</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-title">
                <h1><i class="fas fa-calendar-check"></i> حجوزاتي</h1>
            </div>

            <div class="bookings-tabs">
                <button class="tab-btn active" data-status="all">الكل</button>
                <button class="tab-btn" data-status="pending">قيد الانتظار</button>
                <button class="tab-btn" data-status="confirmed">مؤكدة</button>
                <button class="tab-btn" data-status="cancelled">ملغاة</button>
            </div>

            <div class="bookings-list" id="bookingsList"></div>

            <div class="no-results" id="noBookings" style="display: none;">
                <i class="fas fa-calendar-times"></i>
                <p>لا توجد حجوزات</p>
                <a href="dashboard.html" class="btn btn-primary">ابحثي عن سكن</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span>جميع الحقوق محفوظة &copy; 2025 <i class="fas fa-heart"></i> سكني</span>
    </footer>

    <script>
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('navMenu').classList.toggle('active');
        });

        const bookingsData = [
            {
                id: 1,
                housingTitle: "شقة راقية في جدة",
                city: "جدة",
                district: "حي الروضة",
                price: 3200,
                startDate: "2025-12-01",
                endDate: "2026-06-01",
                status: "confirmed",
                bookingDate: "2025-11-20",
                image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: 2,
                housingTitle: "غرفة مفردة بالرياض",
                city: "الرياض",
                district: "حي النخيل",
                price: 1500,
                startDate: "2025-12-15",
                endDate: "2026-03-15",
                status: "pending",
                bookingDate: "2025-11-25",
                image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: 3,
                housingTitle: "غرفة مشتركة بمكة المكرمة",
                city: "مكة المكرمة",
                district: "العزيزية",
                price: 800,
                startDate: "2025-11-01",
                endDate: "2025-11-20",
                status: "cancelled",
                bookingDate: "2025-10-25",
                image: "https://images.unsplash.com/photo-1540518614846-7eded433c457?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: 4,
                housingTitle: "شقة عائلية فاخرة - الرياض",
                city: "الرياض",
                district: "العليا",
                price: 4500,
                startDate: "2026-01-01",
                endDate: "2026-12-31",
                status: "confirmed",
                bookingDate: "2025-11-18",
                image: "https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=400&q=80"
            },
            {
                id: 5,
                housingTitle: "غرفة مفردة مطلة على البحر",
                city: "جدة",
                district: "الكورنيش",
                price: 2100,
                startDate: "2025-12-10",
                endDate: "",
                status: "pending",
                bookingDate: "2025-11-24",
                image: "https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?auto=format&fit=crop&w=400&q=80"
            }
        ];

        function getStatusText(status) {
            const statusMap = {
                'pending': 'قيد الانتظار',
                'confirmed': 'مؤكدة',
                'cancelled': 'ملغاة'
            };
            return statusMap[status] || status;
        }

        function getStatusClass(status) {
            return `status-${status}`;
        }

        function renderBookings(status = 'all') {
            const bookingsList = document.getElementById('bookingsList');
            const noBookings = document.getElementById('noBookings');
            
            let filteredBookings = bookingsData;
            if (status !== 'all') {
                filteredBookings = bookingsData.filter(b => b.status === status);
            }

            if (filteredBookings.length === 0) {
                bookingsList.innerHTML = '';
                noBookings.style.display = 'block';
                return;
            }

            noBookings.style.display = 'none';
            bookingsList.innerHTML = filteredBookings.map(booking => `
                <div class="booking-card">
                    <img src="${booking.image}" alt="${booking.housingTitle}" class="booking-image">
                    <div class="booking-info">
                        <div class="booking-header">
                            <div class="booking-title">${booking.housingTitle}</div>
                            <span class="booking-status ${getStatusClass(booking.status)}">
                                ${getStatusText(booking.status)}
                            </span>
                        </div>
                        <div class="booking-details">
                            <div class="booking-detail">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${booking.city} - ${booking.district}</span>
                            </div>
                            <div class="booking-detail">
                                <i class="fas fa-calendar-alt"></i>
                                <span>من ${booking.startDate} ${booking.endDate ? 'إلى ' + booking.endDate : '(مفتوح)'}</span>
                            </div>
                            <div class="booking-detail">
                                <i class="fas fa-money-bill-wave"></i>
                                <span>${booking.price} ريال/شهر</span>
                            </div>
                            <div class="booking-detail">
                                <i class="fas fa-clock"></i>
                                <span>تاريخ الحجز: ${booking.bookingDate}</span>
                            </div>
                        </div>
                        <div class="booking-actions">
                            <button class="btn btn-primary" onclick="viewDetails(${booking.id})">
                                <i class="fas fa-eye"></i> عرض التفاصيل
                            </button>
                            ${booking.status === 'pending' ? `
                                <button class="btn btn-danger" onclick="cancelBooking(${booking.id})">
                                    <i class="fas fa-times"></i> إلغاء الحجز
                                </button>
                            ` : ''}
                            ${booking.status === 'confirmed' ? `
                                <button class="btn btn-secondary" onclick="contactOwner(${booking.id})">
                                    <i class="fas fa-envelope"></i> تواصل
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function viewDetails(bookingId) {
            alert(`عرض تفاصيل الحجز رقم ${bookingId}`);
        }

        function cancelBooking(bookingId) {
            if (confirm('هل أنتِ متأكدة من إلغاء هذا الحجز؟')) {
                const booking = bookingsData.find(b => b.id === bookingId);
                if (booking) {
                    booking.status = 'cancelled';
                    const activeTab = document.querySelector('.tab-btn.active').dataset.status;
                    renderBookings(activeTab);
                    alert('تم إلغاء الحجز بنجاح');
                }
            }
        }

        function contactOwner(bookingId) {
            alert(`فتح نافذة التواصل مع المالك للحجز رقم ${bookingId}`);
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderBookings(this.dataset.status);
            });
        });

        renderBookings('all');
    </script>
</body>
</html>
