<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - سكني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #384AA6 0%, #5a6fd8 100%); font-family: 'Tajawal', Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
        .auth-page { width: 100%; padding: 2rem 1rem; }
        .auth-container { max-width: 500px; margin: 0 auto; }
        .auth-card { background: #fff; border-radius: 20px; padding: 2.5rem; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        .auth-header { text-align: center; margin-bottom: 2rem; position: relative; }
        .back-link { position: absolute; right: 0; top: 0; color: #384AA6; font-size: 1.3rem; text-decoration: none; }
        .auth-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #384AA6, #5a6fd8); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
        .auth-icon i { color: #fff; font-size: 2rem; }
        .auth-header h1 { color: #384AA6; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .auth-form { display: flex; flex-direction: column; gap: 1.3rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { color: #384AA6; font-weight: 500; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-group input, .form-group select { padding: 0.9rem; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #384AA6; }
        .password-input { position: relative; }
        .password-input input { width: 100%; padding-left: 3rem; }
        .toggle-password { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #666; cursor: pointer; font-size: 1.1rem; }
        .radio-group { display: flex; gap: 1.5rem; }
        .radio-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .radio-label input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-label { display: flex; align-items: center; gap: 0.7rem; cursor: pointer; }
        .checkbox-label input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .error-message { color: #dc3545; font-size: 0.85rem; margin-top: 0.3rem; display: none; }
        .btn-submit { background: linear-gradient(135deg, #384AA6, #5a6fd8); color: #fff; border: none; padding: 1rem; border-radius: 10px; font-size: 1.1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.7rem; transition: all 0.3s; margin-top: 0.5rem; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 74, 166, 0.4); }
        .form-footer { text-align: center; margin-top: 0.5rem; }
        .form-footer p { color: #666; }
        .form-footer a { color: #384AA6; text-decoration: none; font-weight: 600; }
        .form-footer a:hover { text-decoration: underline; }
        .success-message { background: #d4edda; color: #155724; padding: 1rem; border-radius: 10px; text-align: center; margin-bottom: 1rem; display: none; border: 2px solid #c3e6cb; }
        .success-message i { margin-left: 0.5rem; font-size: 1.2rem; }
        @media (max-width: 500px) {
            .auth-card { padding: 2rem 1.5rem; }
            .auth-header h1 { font-size: 1.5rem; }
            .radio-group { flex-direction: column; gap: 0.8rem; }
        }
    </style>
</head>
<body>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-right"></i>
                    </a>
                    <div class="auth-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h1>إنشاء حساب</h1>
                </div>
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    تم إنشاء الحساب بنجاح! جاري تحويلك...
                </div>
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="fullName"><i class="fas fa-user"></i> الاسم الكامل</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="الاسم الكامل">
                        <span class="error-message" id="fullNameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" required placeholder="example@email.com">
                        <span class="error-message" id="emailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> رقم الجوال</label>
                        <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx">
                        <span class="error-message" id="phoneError"></span>
                    </div>
                    <div class="form-group">
                        <label for="university"><i class="fas fa-university"></i> الجامعة</label>
                        <select id="university" name="university">
                            <option value="">اختاري جامعتك</option>
                            <option value="جامعة أم القرى">جامعة أم القرى</option>
                            <option value="جامعة الملك عبدالعزيز">جامعة الملك عبدالعزيز</option>
                            <option value="جامعة الملك سعود">جامعة الملك سعود</option>
                            <option value="جامعة الأميرة نورة">جامعة الأميرة نورة</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-tag"></i> نوع الحساب</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="userType" value="student" checked>
                                <span>طالبة</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="userType" value="owner">
                                <span>مالكة عقار</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> كلمة المرور</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" required placeholder="••••••••">
                            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> تأكيد كلمة المرور</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agreeTerms" required>
                            <span>أوافق على الشروط والأحكام</span>
                        </label>
                        <span class="error-message" id="termsError"></span>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-user-plus"></i>
                        <span>إنشاء الحساب</span>
                    </button>
                    <div class="form-footer">
                        <p>لديكِ حساب؟ <a href="login.html">سجلي دخولك</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script>
        function togglePassword(inputId, button) {
            const passwordInput = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            
            localStorage.setItem('userName', fullName);
            localStorage.setItem('userEmail', email);
            
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            
            this.style.display = 'none';
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2000);
        });
    </script>
</body>
</html>
